[mypy]
# Under Bazel this is also the runner's interpreter version. It is stated so
# that a mypy run outside Bazel, as an editor's, checks against the same
# version and not its own interpreter's. Moves with PYTHON_VERSION in
# MODULE.bazel.
python_version = 3.14
strict = True
pretty = True
# Only the files an action names are checked; imported code is read for types
# but not reported on.
follow_imports = silent
follow_imports_for_stubs = True
